# Paquets de Florm publiés dans une release GitHub, lancés à la demande :
#   gh workflow run release.yml -f version=0.2.0
# (ou onglet Actions → Release → Run workflow). Sans version : celle de Cargo.toml.
name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Version (ex. 0.2.0) ; vide = celle de Cargo.toml. Tag créé : v<version>"
        required: false
        default: ""
      prerelease:
        description: "Pré-version"
        type: boolean
        default: false

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        env:
          INPUT: ${{ inputs.version }}
        run: |
          v="${INPUT#v}"
          [ -n "$v" ] || v=$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)
          echo "version=$v" >> "$GITHUB_OUTPUT"

  linux:
    needs: version
    # La plus ancienne glibc disponible : le binaire tourne aussi sur les distributions plus anciennes.
    runs-on: ubuntu-22.04
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        run: sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
      - run: cargo build --release
      - name: Outils de paquets
        run: cargo install --locked cargo-deb cargo-generate-rpm
      - name: .deb et .rpm
        run: |
          mkdir dist
          cargo deb --no-build --output "dist/florm_${VERSION}_amd64.deb"
          cargo generate-rpm --output "dist/florm-${VERSION}.x86_64.rpm"
      - name: Fichiers pour le paquet Arch
        run: |
          mkdir arch
          cp target/release/florm packaging/florm.desktop packaging/florm.png packaging/arch/PKGBUILD LICENSE arch/
          cp target/release/florm "dist/florm-${VERSION}-linux-x86_64"
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: arch-src
          path: arch/*

  arch:
    needs: [version, linux]
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: arch-src
          path: build
      - name: makepkg
        run: |
          # makepkg refuse de tourner en root
          useradd -m builder
          chown -R builder build
          cd build
          sed -i "s/^pkgver=.*/pkgver=${VERSION//-/_}/" PKGBUILD
          su builder -c "PKGEXT=.pkg.tar.zst makepkg --nodeps --noconfirm"
          mkdir ../dist && mv ./*.pkg.tar.zst ../dist/
      - uses: actions/upload-artifact@v4
        with:
          name: arch
          path: dist/*

  windows:
    needs: version
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Version
        run: sed -i "0,/^version = .*/s//version = \"$VERSION\"/" Cargo.toml
      - run: cargo build --release
      - run: |
          mkdir dist
          cp target/release/florm.exe "dist/florm-${VERSION}-windows-x86_64.exe"
      # Installateur par utilisateur (packaging/windows/florm.wxs). WiX 5 : la licence des versions 6+
      # demande une cotisation (OSMF) à certains utilisateurs.
      - name: .msi
        run: |
          dotnet tool install --global wix --version 5.0.2
          # une version MSI n'a que des chiffres : 0.2.0-rc1 → 0.2.0
          wix build packaging/windows/florm.wxs -arch x64 \
            -d Version="${VERSION%%-*}" -d Exe=target/release/florm.exe \
            -o "dist/florm-${VERSION}-windows-x86_64.msi"
          rm -f dist/*.wixpdb
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*

  macos:
    needs: version
    runs-on: macos-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin,x86_64-apple-darwin
      - uses: Swatinem/rust-cache@v2
      - name: Version
        run: sed -i '' "1,/^version = .*/s/^version = .*/version = \"$VERSION\"/" Cargo.toml
      - name: Binaire universel (Apple Silicon + Intel)
        run: |
          cargo build --release --target aarch64-apple-darwin
          cargo build --release --target x86_64-apple-darwin
          lipo -create -output florm \
            target/aarch64-apple-darwin/release/florm target/x86_64-apple-darwin/release/florm
      - name: Florm.app
        run: |
          app=Florm.app/Contents
          mkdir -p "$app/MacOS" "$app/Resources"
          cp florm "$app/MacOS/florm"
          sed "s/@VERSION@/$VERSION/g" packaging/macos/Info.plist > "$app/Info.plist"
          mkdir florm.iconset
          for s in 16 32 128 256 512; do
            sips -z $s $s packaging/macos/florm.png --out florm.iconset/icon_${s}x${s}.png >/dev/null
            d=$((s * 2))
            [ $d -le 512 ] && sips -z $d $d packaging/macos/florm.png --out florm.iconset/icon_${s}x${s}@2x.png >/dev/null
          done
          iconutil -c icns florm.iconset -o "$app/Resources/florm.icns"
      # Avec un compte développeur Apple (secrets ci-dessous, voir README « Signer les versions ») :
      # signé Developer ID puis notarisé, macOS l'ouvre sans avertissement même téléchargé par le
      # navigateur. Sans : signature ad hoc, obligatoire pour Apple Silicon.
      - name: Signature
        env:
          CERT: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          CERT_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERT" ]; then
            codesign --force --deep --sign - Florm.app
            exit 0
          fi
          keychain="$RUNNER_TEMP/florm.keychain-db"
          security create-keychain -p ci "$keychain"
          security set-keychain-settings "$keychain"
          security unlock-keychain -p ci "$keychain"
          echo "$CERT" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security import "$RUNNER_TEMP/cert.p12" -k "$keychain" -P "$CERT_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple: -k ci "$keychain" >/dev/null
          security list-keychains -d user -s "$keychain"
          identity=$(security find-identity -v -p codesigning "$keychain" | sed -n 's/.*"\(Developer ID Application:.*\)"/\1/p' | head -1)
          [ -n "$identity" ] || { echo "Pas de certificat « Developer ID Application » dans APPLE_CERTIFICATE_P12" >&2; exit 1; }
          echo "IDENTITY=$identity" >> "$GITHUB_ENV"
          codesign --force --options runtime --timestamp --sign "$identity" Florm.app
      - name: .dmg
        run: |
          mkdir dmg dist
          mv Florm.app dmg/
          ln -s /Applications dmg/Applications
          hdiutil create -volname Florm -srcfolder dmg -format UDZO "dist/Florm-${VERSION}-macos-universal.dmg"
      - name: Notarisation
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: |
          [ -n "${IDENTITY:-}" ] || exit 0
          dmg="dist/Florm-${VERSION}-macos-universal.dmg"
          codesign --timestamp --sign "$IDENTITY" "$dmg"
          xcrun notarytool submit "$dmg" --apple-id "$APPLE_ID" --team-id "$APPLE_TEAM_ID" --password "$APPLE_APP_PASSWORD" --wait
          xcrun stapler staple "$dmg"
      - uses: actions/upload-artifact@v4
        with:
          name: macos
          path: dist/*

  release:
    needs: [version, linux, arch, windows, macos]
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.version.outputs.version }}
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
      - name: Release v${{ needs.version.outputs.version }}
        env:
          PRERELEASE: ${{ inputs.prerelease }}
        run: |
          tag="v$VERSION"
          files=$(ls dist/linux/* dist/arch/* dist/windows/* dist/macos/*)
          # vérifiées par Florm avant d'installer une mise à jour (src/update.rs)
          for f in $files; do (cd "$(dirname "$f")" && sha256sum "$(basename "$f")"); done > SHA256SUMS
          files="$files SHA256SUMS"
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release upload "$tag" $files --clobber
          else
            flags=""
            [ "$PRERELEASE" = "true" ] && flags="--prerelease"
            gh release create "$tag" $files --target "$GITHUB_SHA" --title "Florm $VERSION" --generate-notes $flags
          fi

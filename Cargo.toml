[package]
name = "florm"
version = "0.1.0"
edition = "2021"
description = "Éditeur de texte léger et rapide inspiré de Sublime Text"
license = "MIT"
repository = "https://github.com/mva-odoo/florm"

[dependencies]
# glow as before (0.37 defaults to wgpu: bigger binary, and the title bar draws with a GL callback)
eframe = { version = "0.37", default-features = false, features = ["accesskit", "clipboard", "default_fonts", "glow", "links", "wayland", "x11"] }
# already used by eframe: its emoji and symbol fonts, no longer there by default (the symbols of the UI: ⏳ ⌘ 📄…)
egui = { version = "0.37", default-features = false, features = ["monochrome_emoji_fonts"] }
# winit's default features, that eframe no longer turns on without its own defaults (Wayland through dlopen,
# its decorations); on macOS also used to take out winit's default menu (main.rs)
winit = "0.30"
ropey = "1.6"
syntect = { version = "5.2", default-features = false, features = ["default-fancy"] }
regex = "1"
quick-xml = "0.36"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
ignore = "0.4"
similar = "2"
# clipboard read for "Coller" in the context menu (already used by egui; text only)
arboard = { version = "3", default-features = false, features = ["image-data"] }
portable-pty = "0.8"
vt100 = "0.18"
egui_extras = { version = "0.37", features = ["image", "svg", "file"] }
# already used by egui_extras (svg): the SVG drawn with options that never read other files
resvg = { version = "0.45", default-features = false }
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "gif", "webp", "bmp", "ico"] }
egui_commonmark = "0.26"
# already used by egui_commonmark: the images of a text checked as the viewer will read them
pulldown-cmark = { version = "0.13", default-features = false }
dunce = "1"
ttf-parser = "0.25"
# vérification des mises à jour téléchargées (SHA256SUMS de la release)
sha2 = "0.10"
# syntax trees (tree-sitter): precise highlighting and selection by syntax node; the grammars are
# compiled into Florm (C, built by cc on every system), one per language pack
tree-sitter = "0.27"
streaming-iterator = "0.1"
tree-sitter-python = "0.25"
tree-sitter-javascript = "0.25"
tree-sitter-typescript = "0.23"
tree-sitter-rust = "0.24"
tree-sitter-go = "0.25"
tree-sitter-c = "0.24"
tree-sitter-cpp = "0.23"
tree-sitter-json = "0.24"
tree-sitter-bash = "0.25"
tree-sitter-css = "0.25"
tree-sitter-html = "0.23"
tree-sitter-yaml = "0.7"
tree-sitter-xml = "0.7"
tree-sitter-toml-ng = "0.7"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
panic = "abort"

# Binaire plus petit (-18 %) : les dépendances sont optimisées pour la taille, sauf celles qui
# travaillent à chaque frappe ou à chaque image (coloration, texte, rendu, diff, terminal,
# recherche dans le projet).
[profile.release.package."*"]
opt-level = "s"
[profile.release.package.syntect]
opt-level = 3
[profile.release.package.fancy-regex]
opt-level = 3
[profile.release.package.regex-automata]
opt-level = 3
[profile.release.package.ropey]
opt-level = 3
[profile.release.package.egui]
opt-level = 3
[profile.release.package.epaint]
opt-level = 3
[profile.release.package.similar]
opt-level = 3
[profile.release.package.tree-sitter]
opt-level = 3
[profile.release.package.vt100]
opt-level = 3
[profile.release.package.emath]
opt-level = 3
# the text of egui since 0.34-0.35: shaping (harfrust), fonts (skrifa), glyphs drawn (vello_cpu)
[profile.release.package.harfrust]
opt-level = 3
[profile.release.package.skrifa]
opt-level = 3
[profile.release.package.read-fonts]
opt-level = 3
[profile.release.package.vello_cpu]
opt-level = 3
[profile.release.package.vello_common]
opt-level = 3
[profile.release.package.fearless_simd]
opt-level = 3
[profile.release.package.memchr]
opt-level = 3
[profile.release.package.aho-corasick]
opt-level = 3
[profile.release.package.ignore]
opt-level = 3

# Paquets .deb et .rpm (cargo deb / cargo generate-rpm, voir .github/workflows/release.yml).
# OpenGL, Wayland et X11 sont chargés à l'exécution (dlopen) : la détection automatique ne les voit pas.
[package.metadata.deb]
section = "editors"
depends = "$auto, libgl1, libegl1, libxkbcommon-x11-0, libwayland-client0, libwayland-egl1, libxcursor1, libxi6, libxrandr2"
recommends = "git"
assets = [
    ["target/release/florm", "usr/bin/", "755"],
    ["packaging/florm.desktop", "usr/share/applications/", "644"],
    ["packaging/florm.png", "usr/share/icons/hicolor/512x512/apps/", "644"],
]

[package.metadata.generate-rpm]
assets = [
    { source = "target/release/florm", dest = "/usr/bin/florm", mode = "755" },
    { source = "packaging/florm.desktop", dest = "/usr/share/applications/florm.desktop", mode = "644" },
    { source = "packaging/florm.png", dest = "/usr/share/icons/hicolor/512x512/apps/florm.png", mode = "644" },
]

[package.metadata.generate-rpm.requires]
"libGL.so.1()(64bit)" = "*"
"libEGL.so.1()(64bit)" = "*"
"libxkbcommon-x11.so.0()(64bit)" = "*"
"libwayland-client.so.0()(64bit)" = "*"
"libwayland-egl.so.1()(64bit)" = "*"

# syntect et ropey sont très lents sans optimisation : on optimise les dépendances même en debug.
[profile.dev.package."*"]
opt-level = 2

# Native file dialogs (Windows Explorer / macOS Finder).
[target.'cfg(any(windows, target_os = "macos"))'.dependencies]
rfd = { version = "0.15", default-features = false }

# Linux: the desktop's file chooser through the xdg portal (zbus is already used by egui's accessibility).
[target.'cfg(target_os = "linux")'.dependencies]
zbus = { version = "5", default-features = false, features = ["async-io", "blocking-api"] }

# Icône de florm.exe (build.rs).
[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
